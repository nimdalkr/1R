name: Studio browser checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: studio-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONE_R_TEST_OUTPUT: /tmp/1r-studio-qa
      STUDIO_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - name: Install pinned browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Desktop, mobile and software-renderer HTTP checks
        run: |
          CATALOG_ADMIN_TOKEN=ci-test-only-not-a-production-key node scripts/serve.mjs --sites >/tmp/1r-studio-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          python tests/studio_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-evidence
          path: |
            /tmp/1r-studio-qa/
            /tmp/1r-studio-server.log
          retention-days: 7
