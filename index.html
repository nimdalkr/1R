<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#f6f6f1"><title>1R — 내 방을 위한 작업실</title>
 <meta name="description" content="내 방과 내 물건으로 시작하는 2D·3D 원룸 인테리어 플래너">
 <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
 <link rel="stylesheet" href="./assets/studio.css"><link rel="stylesheet" href="./assets/commerce.css">
</head>
<body>
<header class="app-header">
 <button id="home" class="logo" aria-label="1R 시작 화면">1R<span></span></button>
 <div class="project-meta"><button id="projectTitle">내 원룸</button><span id="saveState" role="status">이 브라우저에 저장</span></div>
 <span class="sp"></span>
 <button id="commandOpen" class="command-trigger">빠른 실행 <kbd>⌘ K</kbd></button>
 <div class="history-tools"><button id="undo" aria-label="되돌리기" title="되돌리기 (Ctrl/Cmd+Z)">↶</button><button id="redo" aria-label="다시 실행" title="다시 실행 (Ctrl/Cmd+Shift+Z)">↷</button></div>
 <button id="openShop" class="shop-launch">가구 찾기</button>
 <details id="fileMenu" class="file-menu"><summary>파일 <span>⌄</span></summary><div class="file-dropdown"><button id="save">브라우저에 저장</button><button id="export">배치 파일 저장</button><button id="imageExport">이미지 저장</button><hr><button id="load">파일 열기</button><button id="newProject">새 프로젝트</button></div></details>
 <input id="file" type="file" accept="application/json,.json" hidden>
</header>
<div class="editor">
 <nav class="tool-rail" aria-label="편집 메뉴">
  <button data-panel="templates"><span data-icon="room"></span><span>구조</span></button>
  <button data-panel="furniture"><span data-icon="chair"></span><span>가구</span></button>
  <button data-panel="inventory"><span data-icon="box"></span><span>내 물건</span><b id="unplacedCount" aria-label="미배치 개수"></b></button>
  <button data-panel="layouts"><span data-icon="layers"></span><span>배치안</span></button>
  <span class="sp"></span><button id="helpOpen"><span data-icon="help"></span><span>도움말</span></button>
 </nav>
 <aside id="library" class="library" hidden><div class="panel-heading"><h2 id="libraryTitle">방 구조</h2><button id="closeLibrary" aria-label="목록 닫기">×</button></div><div id="libraryBody"></div></aside>
 <main id="drawingArea" class="drawing-area" aria-label="방 배치 작업 공간">
  <div class="view-toolbar"><div class="mode-switch" aria-label="보기 방식"><button id="v2" class="active">평면</button><button id="v3">3D</button></div><span id="roomBadge" class="room-badge">예시 치수</span></div>
  <svg id="plan" xmlns="http://www.w3.org/2000/svg" aria-label="2D 평면 편집" role="img" tabindex="0"></svg>
  <canvas id="scene" aria-label="3D 방 편집" hidden tabindex="0"></canvas><svg id="sceneOverlay" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden></svg>
  <div class="camera-controls"><select id="cameraPreset" aria-label="시점" hidden><option value="orbit">전체 보기</option><option value="entry">현관에서</option><option value="bed">침대에서</option></select><select id="renderStyle" aria-label="3D 표현" hidden><option value="soft">재질</option><option value="sketch">선 강조</option><option value="clay">화이트 모형</option></select><button id="cutWalls" aria-pressed="true" hidden>벽 낮추기</button></div>
  <div class="canvas-controls"><div class="tool-group"><button id="selectTool" class="active" title="물건 선택">선택</button><button id="panTool" title="화면 이동 또는 회전">화면</button><button id="rotateObject" title="선택한 가구 90도 회전">90°</button><button id="measureToggle" aria-pressed="true">치수</button></div><div class="tool-group"><button id="fit">맞춤</button><span id="zoomLabel">100%</span></div></div>
  <div id="canvasHint" class="canvas-hint">선택해서 이동 · 휠로 확대</div><button id="mobileProperties" hidden>선택한 물건 수정</button>
 </main>
 <aside id="inspector" class="inspector"><div class="panel-heading"><h2 id="propTitle">방 설정</h2><button id="closeInspector" aria-label="속성 닫기">×</button></div><div id="prop"></div></aside>
</div>
<dialog id="startDialog" class="start-dialog" aria-labelledby="startTitle"><button class="dialog-x" data-close aria-label="시작 화면 닫기">×</button><div class="start-grid"><div class="start-visual"><div class="art-caption"><span>1R / STUDIO</span><span>01</span></div><div id="startArt"></div><div class="art-caption bottom"><span>YOUR ROOM, IN PERSPECTIVE</span><span>배치용 모형</span></div></div><div class="start-content"><span class="eyebrow">ONE ROOM. YOUR WAY.</span><h1 id="startTitle">작은 방,<br>새로운 가능성.</h1><p>내 방의 구조와 짐부터 맞춰보세요.</p><button id="continueProject" class="primary wide">내 작업 이어가기</button><button id="startTemplates" class="start-choice"><span><b>방 구조 고르기</b><small>20가지 예시 구조</small></span><span>↗</span></button><button id="startEmpty" class="start-choice"><span><b>빈 방에서 시작</b><small>직접 치수 입력</small></span><span>↗</span></button><button id="startFile" class="start-choice"><span><b>배치 파일 열기</b><small>기존 작업 가져오기</small></span><span>↗</span></button><small class="privacy-note">로그인 없이, 작업은 이 브라우저에만 저장됩니다.</small></div></div></dialog>
<dialog id="templateDialog" class="template-dialog" aria-label="방 구조 미리보기"></dialog>
<dialog id="editDialog" class="edit-dialog" aria-label="편집 확인"></dialog>
<dialog id="commandDialog" class="command-dialog" aria-label="빠른 실행"><div class="command-input"><span>⌕</span><input id="commandQuery" type="search" placeholder="가구 추가, 시점, 파일 저장…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="commandResults" aria-expanded="true"><button data-close aria-label="빠른 실행 닫기"><kbd>ESC</kbd></button></div><div id="commandResults" role="listbox"></div><div class="command-foot">↑ ↓ 선택 <span>Enter 실행</span></div></dialog>
<dialog id="compareDialog" class="compare-dialog" aria-label="배치안 비교"><div class="panel-heading"><h2>배치 비교</h2><button data-close aria-label="비교 닫기">×</button></div><p id="compareSummary"></p><div class="compare-grid"><section><h3 id="compareAName">배치 A</h3><canvas id="compareA" aria-label="비교 A"></canvas></section><section><h3 id="compareBName">배치 B</h3><canvas id="compareB" aria-label="비교 B"></canvas></section></div><p class="note">같은 카메라 기준 · 끌어서 함께 회전</p></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./assets/studio.js"></script>
</body></html>
