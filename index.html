function fit(){let W=C.clientWidth,H=C.clientHeight;scale=Math.min((W-100)/doc.room.w,(H-100)/doc.room.d);pan={x:(W-doc.room.w*scale)/2,y:(H-doc.room.d*scale)/2}}
function xy(x,z){return{x:pan.x+x*scale,y:pan.y+z*scale}}

function rr(o){let a=o.r*Math.PI/180,c=Math.cos(a),s=Math.sin(a),hw=o.w/2,hd=o.d/2;return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(p=>({x:o.x+p[0]*c-p[1]*s,z:o.z+p[0]*s+p[1]*c}))}
function polyHit(p,o){let pts=rr(o),inside=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){let a=pts[i],b=pts[j];if(((a.z>p.z)!=(b.z>p.z))&&p.x<(b.x-a.x)*(p.z-a.z)/(b.z-a.z)+a.x)inside=!inside}return inside}

function renderProp(){if(!sel){$('#prop').innerHTML='<div class="empty">캔버스에서 물건을 선택하세요.</div>';return}$('#prop').innerHTML=`<h3>${sel.name}</h3><div class="field"><label>이름</label><input data-k="name" value="${sel.name}"></div><div class="grid2"><div class="field"><label>가로 cm</label><input data-k="w" type="number" value="${sel.w}"></div><div class="field"><label>깊이 cm</label><input data-k="d" type="number" value="${sel.d}"></div><div class="field"><label>높이 cm</label><input data-k="h" type="number" value="${sel.h}"></div><div class="field"><label>각도 °</label><input data-k="r" type="number" value="${sel.r}"></div></div><div class="actions"><button id="p90">90° 회전</button><button id="pdel">삭제</button></div>`;$('#prop').onchange=e=>{let k=e.target.dataset.k;if(!k)return;sel[k]=k==='name'?e.target.value:+e.target.value;persist();render()};$('#p90').onclick=()=>{sel.r=(sel.r+90)%360;persist();renderAll()};$('#pdel').onclick=removeSel}
function removeSel(){if(!sel)return;doc.objects=doc.objects.filter(o=>o!==sel);sel=null;persist();renderAll()}
C.onpointerdown=e=>{let r=C.getBoundingClientRect(),p=inv(e.clientX-r.left,e.clientY-r.top);if(view==='2d'){sel=[...doc.objects].reverse().find(o=>polyHit(p,o))||null;if(sel)drag={dx:p.x-sel.x,dz:p.z-sel.z};}else drag={sx:e.clientX,sy:e.clientY,a:cam.a,e:cam.e};renderProp();render()};C.onpointermove=e=>{if(!drag)return;let r=C.getBoundingClientRect();if(view==='2d'&&sel){let p=inv(e.clientX-r.left,e.clientY-r.top);sel.x=Math.max(0,Math.min(doc.room.w,p.x-drag.dx));sel.z=Math.max(0,Math.min(doc.room.d,p.z-drag.dz));render()}else if(view==='3d'){cam.a=drag.a+(e.clientX-drag.sx)*.008;cam.e=Math.max(.25,Math.min(1.25,drag.e+(e.clientY-drag.sy)*.006));render()}};onpointerup=()=>{if(drag){persist();drag=null}};C.onwheel=e=>{e.preventDefault();scale*=Math.exp(-e.deltaY*.001);scale=Math.max(.3,Math.min(3,scale));render()};
$('#rot').onclick=()=>{if(sel){sel.r=(sel.r+90)%360;persist();renderAll()}};$('#del').onclick=removeSel;$('#fit').onclick=()=>{fit();render()};$('#v2').onclick=()=>{view='2d';$('#v2').classList.add('active');$('#v3').classList.remove('active');fit();render()};$('#v3').onclick=()=>{view='3d';$('#v3').classList.add('active');$('#v2').classList.remove('active');render()};
function persist(){localStorage.setItem('1r-project',JSON.stringify(doc));$('#status').textContent=`${doc.objects.length}개 물건 · 자동 저장됨`}
$('#save').onclick=persist;$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}));a.download='1R-layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#load').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.room||!Array.isArray(x.objects))throw Error();doc=x;sel=null;fit();persist();renderAll()}catch{alert('1R JSON 파일을 읽지 못했습니다.')}};$('#roomH').onchange=e=>{doc.room.h=+e.target.value;persist();render()};
function renderAll(){renderTemplates();renderProp();$('#roomH').value=doc.room.h;render()}
try{let s=localStorage.getItem('1r-project');if(s)doc=JSON.parse(s);else applyTpl(T[5])}catch{applyTpl(T[5])}renderTemplates();requestAnimationFrame(()=>{fit();resize();renderAll()});addEventListener('resize',()=>{resize()});
</script></body></html>
